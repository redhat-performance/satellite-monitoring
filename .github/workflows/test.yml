---
# PR checks: safe, read-only validation that runs on pull requests.
# IMPORTANT: this workflow must never use secrets or a self-hosted runner,
# because it executes code from pull requests (including untrusted forks).
# Privileged integration testing lives in integration.yml and only runs on
# trusted events (push to master / manual dispatch).
name: PR checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run ansible-lint
        uses: ansible/ansible-lint@main
        with:
          working_directory: ansible
