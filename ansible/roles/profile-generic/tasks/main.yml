---
# Install profiling packages pre-deploy, while the debug/source repos are still
# reachable (a Satellite-served capsule later has only OS+deployer+containers).
# -debuginfo is installed directly (not `debuginfo-install`, which no-ops on
# not-yet-installed packages); versions may skew slightly from deployed binaries.

- name: Install bcc-tools, perf and js-d3-flame-graph packages
  ansible.builtin.dnf:
    name:
      - bcc-tools
      - perf
      - js-d3-flame-graph

- name: Build the debug package list
  ansible.builtin.set_fact:
    _profile_debug_packages:
      - apr
      - httpd
      - libnghttp2
      - mod_ssl
      - openssl-libs
      - postgresql-server
      - "{{ 'python3.12' if ansible_facts['distribution_major_version'] | int >= 10 else 'python3.11' }}"
      - "{{ 'valkey' if ansible_facts['distribution_major_version'] | int >= 10 else 'redis' }}"
      - ruby-libs
      - libxcrypt
      # Runtime packages, not their header-only -devel (which have no -debuginfo).
      - tcl
      - "{{ 'zlib-ng-compat' if ansible_facts['distribution_major_version'] | int >= 10 else 'zlib' }}"

# Until `ansible.builtin.dnf` supports natively installing debuginfo
- name: Install required debug packages
  ansible.builtin.shell:
    cmd: |
      dnf install -y \
        --enablerepo {{ baseos_debug_repo_name }} \
        --enablerepo {{ baseos_source_repo_name }} \
        --enablerepo {{ appstream_debug_repo_name }} \
        --enablerepo {{ appstream_source_repo_name }} \
        {{ _profile_debug_packages | map('regex_replace', '$', '-debuginfo') | join(' ') }}
  register: _profile_debuginfo
  changed_when: "'Installed:' in _profile_debuginfo.stdout"

- name: Install EPEL
  ansible.builtin.include_role:
    name: epel
    tasks_from: install

# Not yet packaged for EPEL 10 (genuinely absent, not just renamed).
- name: Install flamegraph package from EPEL
  when:
    - ansible_facts['distribution_major_version'] | int < 10
  ansible.builtin.dnf:
    name:
      - flamegraph

# EPEL 10 doesn't package flamegraph yet, so vendor the upstream project
# directly instead (pure Perl, no compilation) - keeps flamegraph.pl
# resolving on $PATH exactly like the EPEL-installed version does on
# EL9, so bpf_convert.yaml needs no changes on either OS version.
- name: Vendor FlameGraph from upstream
  when:
    - ansible_facts['distribution_major_version'] | int >= 10
  block:
    - name: Clone FlameGraph
      ansible.builtin.git:
        repo: https://github.com/brendangregg/FlameGraph.git
        dest: /opt/FlameGraph
        version: master

    - name: Symlink flamegraph.pl onto PATH
      ansible.builtin.file:
        src: /opt/FlameGraph/flamegraph.pl
        dest: /usr/local/bin/flamegraph.pl
        state: link

- name: Uninstall EPEL
  ansible.builtin.include_role:
    name: epel
    tasks_from: uninstall
...
