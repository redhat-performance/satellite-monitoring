---
#
# Install profiling packages (Generic)
#

- name: Assert ansible_facts['distribution_major_version']
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution_major_version'] is defined

# Until `ansible.builtin.dnf` supports natively `debuginfo-install`
- name: Disable Foreman protector lock
  ansible.builtin.command:
    cmd: |
      foreman-maintain packages unlock
  when:
    - product is not defined or
      ( product == 'satellite' and sat_version is defined and sat_version != 'foremanctl' )

- name: Install bcc-tools, perf and js-d3-flame-graph packages
  ansible.builtin.dnf:
    name:
      - bcc-tools
      - perf
      - js-d3-flame-graph

# Until `ansible.builtin.dnf` supports natively `debuginfo-install`
- name: Install required debug packages
  ansible.builtin.shell:
    cmd: |
      dnf debuginfo-install -y \
        --enablerepo rhel-{{ ansible_facts['distribution_major_version'] }}-for-x86_64-baseos-debug-rpms \
        --enablerepo rhel-{{ ansible_facts['distribution_major_version'] }}-for-x86_64-baseos-source-rpms \
        --enablerepo rhel-{{ ansible_facts['distribution_major_version'] }}-for-x86_64-appstream-debug-rpms \
        --enablerepo rhel-{{ ansible_facts['distribution_major_version'] }}-for-x86_64-appstream-source-rpms \
        apr httpd libnghttp2 mod_ssl \
        openssl-libs \
        postgresql-server \
        {{ 'python3.12' if ansible_facts['distribution_major_version'] | int >= 10 else 'python3.11' }} \
        {{ 'valkey' if ansible_facts['distribution_major_version'] | int >= 10 else 'redis' }} \
        ruby-libs \
        libxcrypt tcl-devel zlib-devel

- name: Install EPEL
  ansible.builtin.include_role:
    name: epel
    tasks_from: install

# Not yet packaged for EPEL 10 (genuinely absent, not just renamed).
- name: Install flamegraph package from EPEL
  when:
    - ansible_facts['distribution_major_version'] | int < 10
  ansible.builtin.dnf:
    name:
      - flamegraph

# EPEL 10 doesn't package flamegraph yet, so vendor the upstream project
# directly instead (pure Perl, no compilation) - keeps flamegraph.pl
# resolving on $PATH exactly like the EPEL-installed version does on
# EL9, so bpf_convert.yaml needs no changes on either OS version.
- name: Vendor FlameGraph from upstream
  when:
    - ansible_facts['distribution_major_version'] | int >= 10
  block:
    - name: Clone FlameGraph
      ansible.builtin.git:
        repo: https://github.com/brendangregg/FlameGraph.git
        dest: /opt/FlameGraph
        version: master

    - name: Symlink flamegraph.pl onto PATH
      ansible.builtin.file:
        src: /opt/FlameGraph/flamegraph.pl
        dest: /usr/local/bin/flamegraph.pl
        state: link

- name: Uninstall EPEL
  ansible.builtin.include_role:
    name: epel
    tasks_from: uninstall

# Until `ansible.builtin.dnf` supports natively `debuginfo-install`
- name: Re-enable Foreman protector lock
  ansible.builtin.command:
    cmd: |
      foreman-maintain packages lock
  when:
    - product is not defined or
      ( product == 'satellite' and sat_version is defined and sat_version != 'foremanctl' )
...
