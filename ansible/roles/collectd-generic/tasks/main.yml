---
#
# Install/configure collectd for Satellite (Generic)
#

- name: Assert ansible_facts['distribution_major_version']
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution_major_version'] is defined

- name: Disable Foreman protector lock
  ansible.builtin.command:
    cmd: |
      foreman-maintain packages unlock
  when:
    - product is not defined or
      ( product == 'satellite' and sat_version is defined and sat_version != 'foremanctl' )

- name: Gather package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Install EPEL
  ansible.builtin.include_role:
    name: epel
    tasks_from: install

# RHEL 10.1+ split EPEL-only SELinux policy modules (e.g. collectd's) out of
# the base selinux-policy package into "-extra" subpackages shipped via CRB.
# RHEL 8/9 never needed this - their EPEL policy modules ship in the base
# selinux-policy package directly.
- name: Enable CodeReady Builder for EPEL SELinux policy modules (EL10+)
  when:
    - ansible_facts['distribution_major_version'] | int >= 10
  vars:
    crb_repo_name: >-
      codeready-builder-for-rhel-{{ ansible_facts['distribution_major_version'] }}-x86_64-rpms
  block:
    - name: Enable CRB repository
      community.general.rhsm_repository:
        name: "{{ crb_repo_name }}"
        state: enabled

    - name: Install SELinux policy extra module (provides collectd_t, etc.)
      ansible.builtin.dnf:
        name: selinux-policy-targeted-extra
        state: present

    # CRB is only needed for the install above; disable it immediately
    # rather than leaving it enabled for the rest of the role, same
    # reasoning as EPEL and the Foreman protector lock.
    - name: Disable CRB repository
      community.general.rhsm_repository:
        name: "{{ crb_repo_name }}"
        state: disabled

- name: Install collectd related packages from EPEL
  vars:
    collectd_packages_key: >-
      {{ config_type }}-el{{ ansible_facts['distribution_major_version'] }}
  ansible.builtin.dnf:
    name: >-
      {{ collectd_packages_el_overrides[collectd_packages_key]
         | default(collectd_packages[config_type]) }}

# EPEL and the Foreman protector lock are only needed for the package install
# above; release both immediately rather than holding them for the rest of
# the role (satellite config, templating, selinux, service management).
- name: Uninstall EPEL
  ansible.builtin.include_role:
    name: epel
    tasks_from: uninstall

- name: Re-enable Foreman protector lock
  ansible.builtin.command:
    cmd: |
      foreman-maintain packages lock
  when:
    - product is not defined or
      ( product == 'satellite' and sat_version is defined and sat_version != 'foremanctl' )

- name: Satellite specific collectd configuration
  when:
    - product is not defined or product == 'satellite' or product == 'foreman'
  block:
    #
    # Enable mod_status (RPM Apache installs only; foremanctl's reverse-proxy
    # vhost already has mod_status enabled by default)
    #
    - name: Enable mod_status
      ansible.builtin.command:
        cmd: |
          foreman-installer --enable-apache-mod-status
      when:
        - sat_version is not defined or sat_version != 'foremanctl'

    # Pulp/pulpcore runs on both satellite6 and capsules, using the identical
    # credential regardless of config_type, so it's fetched once here rather
    # than duplicated in both config_type-specific blocks below.
    - name: Pulp PostgreSQL password
      when:
        - config_type in ['satellite6', 'capsules']
      block:
        - name: Get pulp PostgreSQL password
          ansible.builtin.shell:
            cmd: |
              grep -i 'password' /etc/pulp/settings.py | awk -F'"' '{print $2}'
          register: pulp_password
          when:
            - sat_version is not defined or sat_version != 'foremanctl'

        - name: Get pulp PostgreSQL password
          when:
            - sat_version is defined and sat_version == 'foremanctl'
          block:
            - name: Get pulp PostgreSQL password secret
              containers.podman.podman_secret_info:
                name: pulp-db-password
                showsecret: true
              register: _pulp_db_secret

            - name: Set pulp PostgreSQL password fact from foremanctl secret
              ansible.builtin.set_fact:
                # Shaped like a command/shell registration result (.stdout)
                # so collectd.conf.j2 needs no RPM/foremanctl branching.
                pulp_password:
                  stdout: "{{ _pulp_db_secret.secrets[0].SecretData }}"

    - name: Satellite6 specific configuration steps
      when:
        - "config_type == 'satellite6'"
      block:
        - name: Get PostgreSQL passwords
          when:
            - sat_version is not defined or sat_version != 'foremanctl'
          block:
            - name: Get Candlepin PostgreSQL Password
              ansible.builtin.command:
                cmd: |
                  grep 'jpa.config.hibernate.connection.password' /etc/candlepin/candlepin.conf
              register: satellite_candlepin_password

            - name: Get Foreman PostgreSQL Password
              ansible.builtin.shell:
                cmd: |
                  grep 'password' /etc/foreman/database.yml | awk -F'"' '{print $2}'
              register: satellite_foreman_password

        - name: Get PostgreSQL passwords
          when:
            - sat_version is defined and sat_version == 'foremanctl'
          block:
            - name: Get Candlepin PostgreSQL config secret
              containers.podman.podman_secret_info:
                name: candlepin-candlepin-conf
                showsecret: true
              register: _candlepin_conf_secret

            - name: Get Foreman database URL secret
              containers.podman.podman_secret_info:
                name: foreman-database-url
                showsecret: true
              register: _foreman_database_url_secret

            - name: Set PostgreSQL password facts from foremanctl secrets
              vars:
                candlepin_password_regex: >-
                  jpa\.config\.hibernate\.connection\.password=[^\n]*
                foreman_database_url_regex: '^[a-zA-Z]+://[^:]+:([^@]+)@.*$'
              ansible.builtin.set_fact:
                # Shaped like a command/shell registration result (.stdout)
                # so collectd.conf.j2 needs no RPM/foremanctl branching.
                satellite_candlepin_password:
                  stdout: >-
                    {{ _candlepin_conf_secret.secrets[0].SecretData
                       | regex_search(candlepin_password_regex) }}
                satellite_foreman_password:
                  stdout: >-
                    {{ _foreman_database_url_secret.secrets[0].SecretData
                       | regex_replace(foreman_database_url_regex, '\1') }}

# - name: Allow group read to /etc/origin/master/admin.key
#   file: path=/etc/origin/master/admin.key mode=0640
#   when: "config_type == 'ose'"

- name: Configure collectd.conf
  ansible.builtin.template:
    src={{config_type}}.collectd.conf.j2
    dest=/etc/collectd.conf
    owner=root
    group=root
    mode=0644

# Configure selinux bits
#
# Both steps below only apply when collectd's own SELinux policy module
# (defining collectd_t) is actually present. It always is on EL8/EL9; on
# EL10 it requires the CRB-provided selinux-policy-targeted-extra package
# installed above, which can still be absent (e.g. no valid subscription
# entitlement for CRB) - skip gracefully rather than fail in that case.
- name: Check for a collectd SELinux policy module
  ansible.builtin.command:
    cmd: semodule -l
  register: collectd_selinux_module
  changed_when: false

- name: Collectd SELinux customization
  # Force the OS's own default python3 rather than Ansible's auto-discovered
  # one. `community.general.selinux_permissive` needs the seobject module
  # from policycoreutils-python-utils, which is only built against the
  # platform's native python3 ABI. On hosts with a second, higher-numbered
  # python3.X installed for unrelated reasons (e.g. foremanctl's
  # python3.12-obsah dependency, or Satellite 6.19's own python3.12-aiohttp
  # stack on RHEL 9), Ansible's auto/auto_silent discovery prefers that
  # higher version over the system default, and it lacks seobject, causing
  # "ModuleNotFoundError: No module named 'seobject'".
  # /usr/bin/python3 always resolves to whatever the OS itself considers
  # its default python3, so this is correct on both RHEL 9 (-> python3.9,
  # has seobject) and RHEL 10 (-> python3.12, has seobject there too).
  vars:
    ansible_python_interpreter: /usr/bin/python3
  when:
    - "'collectd' in collectd_selinux_module.stdout_lines"
  block:
    - name: Set permissive for collectd
      community.general.selinux_permissive:
        name: collectd_t
        permissive: true

    #
    # Additional policy bits may be needed for exec
    #
    - name: Collectd policy customization
      ansible.builtin.copy:
        src=custom-collectd.pp
        dest=/root/custom-collectd.pp
        owner=root
        group=root
        mode=644

    - name: Check for collectd custom policy
      ansible.builtin.command:
        cmd: semodule -l
      register: collectd_custom
      changed_when: false

    - name: Set custom policy for collectd
      ansible.builtin.command:
        cmd: semodule -i /root/custom-collectd.pp
      when:
        - "'custom-collectd' not in collectd_custom.stdout_lines"

# add collectd default group (not added with rpm -ivh)
- name: Add collectd group
  group: name=collectd state=present

# Start collectd service
- name: Setup collectd service
  service: name=collectd state=restarted enabled=true
...
