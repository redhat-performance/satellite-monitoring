---
# Install/configure collectd. collectd_phase:
#   all (default) - install + full config; preinstall - install + basic config
#   (pre-deploy); reconfigure - full config only, no installs (post-deploy).

- name: Set deployment method task path
  ansible.builtin.set_fact:
    _deployment_method_tasks_dir: "{{ playbook_dir }}/../../playbooks/satellite/tasks/deployment_method"

- name: Derive collectd config profile from phase
  ansible.builtin.set_fact:
    collectd_config_profile: "{{ 'basic' if collectd_phase | default('all') == 'preinstall' else 'full' }}"

- name: Install collectd (repos, packages, selinux)
  ansible.builtin.include_tasks: install.yaml
  when: collectd_phase | default('all') in ['all', 'preinstall']

- name: Configure collectd (template + service)
  ansible.builtin.include_tasks: configure.yaml
...
