---
#
# Vars for collectd-generic
#

collectd_packages:
  graphite:
    - collectd
    - collectd-turbostat
  docker-hosts:
    - collectd
  satellite6:
    - collectd
    - collectd-apache
    - collectd-disk
    - collectd-postgresql
  capsules:
    - collectd
    - collectd-apache
    - collectd-disk
    - collectd-postgresql

# Per-(config_type, EL major version) overrides, only needed when a specific
# EL release's package set differs from collectd_packages[config_type] above
# (e.g. a package not being available for that release in EPEL).
collectd_packages_el_overrides: {}
